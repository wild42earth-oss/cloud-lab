name: prototype-tests
on:
  push:
    paths:
      - "group-evolving-agents/**"
  pull_request:
    paths:
      - "group-evolving-agents/**"
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group-evolving-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m gea.experiments.run --seeds 2 --generations 3
      - run: python -m gea.evaluation.plot_results
